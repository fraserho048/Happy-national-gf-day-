<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy National GF Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd1e8,#ffe6f2);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.page{
display:none;
width:100%;
height:100%;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{
display:flex;
}

h1{
color:#ff4f87;
margin-bottom:15px;
}

p{
color:#666;
margin-bottom:25px;
}

button{
padding:15px 30px;
border:none;
border-radius:50px;
background:#ff5f9d;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.qr{
width:220px;
height:220px;
background:white;
padding:15px;
border-radius:30px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
animation:beat 1.5s infinite;
}

.qr img{
width:100%;
height:100%;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}

.heart{
position:absolute;
bottom:-50px;
font-size:20px;
animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-120vh);
opacity:0;
}
}

input{
width:220px;
padding:15px;
border-radius:30px;
border:none;
text-align:center;
font-size:20px;
margin-top:15px;
}

.gifts{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.gift{
width:120px;
height:120px;
background:#ff7bb3;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
cursor:pointer;
transition:.3s;
}

.gift:hover{
transform:scale(1.1);
}

.popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
}

.card{
background:white;
width:90%;
max-width:400px;
padding:25px;
border-radius:20px;
text-align:center;
max-height:80vh;
overflow:auto;
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<!-- HOME -->

<div class="page active" id="home">

<h1>Happy National GF Day Baby😘💜</h1>

<p>Scan My Heart ❤️</p>

<div class="qr">

<img id="qrImage"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://example.com">

</div>

<button onclick="showPassword()">
Continue ❤️
</button>

</div>

<!-- PASSWORD -->

<div class="page" id="passwordPage">

<h1>Password 🔐</h1>

<p>Enter our special password</p>

<div id="display"
style="
font-size:35px;
letter-spacing:10px;
margin:20px;
color:#ff4f87;
font-weight:bold;
">

••••

</div>

<div class="keypad">

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>

<button onclick="erase()">⌫</button>
<button onclick="press('0')">0</button>
<button onclick="checkPassword()">❤️</button>

</div>

</div>

<!-- GIFTS -->

<div class="page" id="giftPage">

<h1>Choose Your Gift 🎁</h1>

<div class="gifts">

<div class="gift" onclick="openGift(1)">💌</div>

<div class="gift" onclick="openGift(2)">📸</div>

<div class="gift" onclick="openGift(3)">🎥</div>

</div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="card" id="card">

</div>

</div>


  <script>

function showPassword(){
    document.getElementById("home").classList.remove("active");
    document.getElementById("passwordPage").classList.add("active");
}

let enteredPassword = "";

function press(num){

    if(enteredPassword.length >= 4) return;

    enteredPassword += num;

    document.getElementById("display").innerHTML =
        "❤️".repeat(enteredPassword.length) +
        "•".repeat(4-enteredPassword.length);

}

function erase(){

    enteredPassword = enteredPassword.slice(0,-1);

    document.getElementById("display").innerHTML =
        "❤️".repeat(enteredPassword.length) +
        "•".repeat(4-enteredPassword.length);

}

function checkPassword(){

    if(enteredPassword==="1711"){

        document.getElementById("passwordPage").classList.remove("active");

        document.getElementById("giftPage").classList.add("active");

    }else{

        alert("Wrong Password Baby 💜");

        enteredPassword="";

        document.getElementById("display").innerHTML="••••";

    }

}

    
    


function openGift(number){

const popup=document.getElementById("popup");
const card=document.getElementById("card");

popup.style.display="flex";

if(number==1){

card.innerHTML=`

<h2>💌 My Letter</h2>

<p style="line-height:30px">

Replace this with your own love letter ❤️

<br><br>

Happy National GF Day Baby😘💜

<br><br>

Thank you for always being with me.

I love you more than words can ever explain.

Forever yours ❤️

</p>

<br>

<button onclick="closePopup()">Close</button>

`;

}

if(number==2){

card.innerHTML=`

<h2>📸 Our Memories</h2>

<p>Replace these images with your own later.</p>

<img src="https://picsum.photos/300/200?1" style="width:100%;border-radius:15px;margin-top:15px;">

<img src="https://picsum.photos/300/200?2" style="width:100%;border-radius:15px;margin-top:15px;">

<img src="https://picsum.photos/300/200?3" style="width:100%;border-radius:15px;margin-top:15px;">

<br><br>

<button onclick="closePopup()">Close</button>

`;

}

if(number==3){

card.innerHTML=`

<h2>🎥 Our Video</h2>

<p>You can replace this video later.</p>

<video controls width="100%" style="border-radius:15px;">

<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">

</video>

<br><br>

<button onclick="closePopup()">Close</button>

`;

}

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

for(let i=0;i<40;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(Math.random()*6+5)+"s";

heart.style.fontSize=(Math.random()*15+18)+"px";

document.getElementById("hearts").appendChild(heart);

}

</script>

</body>
</html>
