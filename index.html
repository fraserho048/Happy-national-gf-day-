<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy National GF Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd1e8,#ffe6f2);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.page{
display:none;
width:100%;
height:100%;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{
display:flex;
}

h1{
color:#ff4f87;
margin-bottom:15px;
}

p{
color:#666;
margin-bottom:25px;
}

button{
padding:15px 30px;
border:none;
border-radius:50px;
background:#ff5f9d;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.qr{

width:230px;
height:230px;

background:white;

padding:15px;

clip-path:polygon(
50% 90%,
10% 45%,
10% 25%,
20% 10%,
35% 5%,
50% 20%,
65% 5%,
80% 10%,
90% 25%,
90% 45%
);

box-shadow:

0 0 25px #ff5f9d,
0 0 50px #ffb6d9;

animation:heartBeat 1.5s infinite;

overflow:hidden;

}


.qr img{

width:100%;
height:100%;

}


@keyframes heartBeat{

0%{
transform:scale(1);
}


50%{
transform:scale(1.08);
}


100%{
transform:scale(1);

}

}

.qr img{
width:100%;
height:100%;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.hearts{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}

.heart{
position:absolute;
bottom:-50px;
font-size:20px;
animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-120vh);
opacity:0;
}
}

input{
width:220px;
padding:15px;
border-radius:30px;
border:none;
text-align:center;
font-size:20px;
margin-top:15px;
}

.gifts{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.gift{
width:120px;
height:120px;
background:#ff7bb3;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
cursor:pointer;
transition:.3s;
}

.gift:hover{
transform:scale(1.1);
}

.popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
}

.card{
background:white;
width:90%;
max-width:400px;
padding:25px;
border-radius:20px;
text-align:center;
max-height:80vh;
overflow:auto;
}
  .gifts{
display:flex;
gap:30px;
justify-content:center;
  }

 .giftBox{

width:130px;
height:130px;
position:relative;
cursor:pointer;
perspective:800px;

}


.box{

position:absolute;
bottom:0;

width:120px;
height:90px;

background:#ff5f9d;

border-radius:10px;

font-size:55px;

display:flex;
align-items:center;
justify-content:center;

box-shadow:0 10px 25px rgba(0,0,0,.25);

}


.lid{

position:absolute;

top:15px;

left:5px;

width:120px;

height:25px;

background:#ff9bc5;

border-radius:10px;

z-index:2;

transform-origin:bottom;

transition:.8s;

}


.giftBox:hover{

transform:scale(1.08);

}


/* OPEN ANIMATION */

.open .lid{

transform:

translateY(-60px)

rotateX(60deg)

rotateZ(-15deg);

}


.open .box{

animation:

giftShake .5s,

popGift .8s .5s;

}



@keyframes giftShake{

0%{transform:rotate(0)}

25%{transform:rotate(10deg)}

50%{transform:rotate(-10deg)}

75%{transform:rotate(10deg)}

100%{transform:rotate(0)}

}



@keyframes popGift{

from{

transform:translateY(0);

}

to{

transform:translateY(-20px);

}

}   


.giftBox:hover{
transform:scale(1.1);
}


.open .lid{
transform:translateY(-50px) rotate(-15deg);
}


.open .box{
animation:shake .5s;
}


@keyframes shake{

0%{transform:rotate(0)}

25%{transform:rotate(10deg)}

50%{transform:rotate(-10deg)}

75%{transform:rotate(10deg)}

100%{transform:rotate(0)}

}

  .envelope{
width:220px;
height:150px;
background:#ff8fc0;
margin:20px auto;
position:relative;
border-radius:10px;
cursor:pointer;
box-shadow:0 10px 20px rgba(0,0,0,.2);
overflow:hidden;
}

.envelope:before{
content:"";
position:absolute;
top:0;
left:0;
border-left:110px solid transparent;
border-right:110px solid transparent;
border-top:80px solid #ff5f9d;
}

.paper{
background:white;
width:90%;
padding:20px;
border-radius:15px;
margin:auto;
display:none;
animation:slideUp .8s;
}

@keyframes slideUp{

from{
transform:translateY(100px);
opacity:0;
}

to{
transform:translateY(0);
opacity:1;
}

}

.showLetter{
display:block;
}

.album{

display:flex;
overflow-x:auto;
gap:20px;
scroll-snap-type:x mandatory;
padding:20px;

}


.album img{

width:280px;
height:380px;
object-fit:cover;
border-radius:20px;
scroll-snap-align:center;

box-shadow:0 10px 25px rgba(0,0,0,.2);

transition:.3s;

}


.album img:hover{

transform:scale(1.05);

}

.videoBox video{

width:100%;
border-radius:20px;

box-shadow:
0 0 30px rgba(255,95,157,.5);

}

.keypad{

display:grid;
grid-template-columns:repeat(3,80px);
gap:18px;
justify-content:center;
margin-top:20px;

}


.keypad button{

width:80px;
height:80px;

border-radius:50%;

background:
linear-gradient(
145deg,
#ff9bc5,
#ff4f87
);

color:white;

font-size:28px;

font-weight:bold;

border:none;

box-shadow:
0 8px 20px rgba(255,79,135,.4);

transition:.2s;

}


.keypad button:active{

transform:scale(.85);

box-shadow:
0 0 30px #ff5f9d;

}


#display{

background:rgba(255,255,255,.5);

padding:15px 25px;

border-radius:50px;

backdrop-filter:blur(10px);

}

.heartBurst{

position:fixed;

font-size:30px;

animation:burst 1.5s forwards;

pointer-events:none;

z-index:999;

}


@keyframes burst{

0%{

transform:translate(0,0) scale(1);

opacity:1;

}


100%{

transform:translate(var(--x),var(--y)) scale(2);

opacity:0;

}

}    
</style>
</head>
  
<div id="sparkles"></div>
  
<body>

<div class="hearts" id="hearts"></div>

<!-- HOME -->

<div class="page active" id="home">

<h1>Happy National GF Day Baby😘💜</h1>

<p>Scan My Heart ❤️</p>

<div class="qr">

<img id="qrImage"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://fraserho048.github.io/Happy-national-gf-day-/">

</div>

<button onclick="showPassword()">
Continue ❤️
</button>

</div>

<!-- PASSWORD -->

<div class="page" id="passwordPage">

<h1>Password 🔐</h1>

<p>Enter our special password</p>

<div id="display"
style="
font-size:35px;
letter-spacing:10px;
margin:20px;
color:#ff4f87;
font-weight:bold;
">

••••

</div>

<div class="keypad">

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>

<button onclick="erase()">⌫</button>
<button onclick="press('0')">0</button>
<button onclick="checkPassword()">❤️</button>

</div>

</div>
  
<!-- GIFTS -->

<div class="page" id="giftPage">

<h1>Your Surprise 🎁</h1>

<p>Choose one baby ❤️</p>

<div class="gifts">

<div class="giftBox" onclick="openGift(1)">
<div class="lid"></div>
<div class="box">🎁</div>
</div>


<div class="giftBox" onclick="openGift(2)">
<div class="lid"></div>
<div class="box">🎁</div>
</div>


<div class="giftBox" onclick="openGift(3)">
<div class="lid"></div>
<div class="box">🎁</div>
</div>


</div>

</div>


<!-- POPUP -->

<div class="popup" id="popup">

<div class="card" id="card">

</div>

</div>


  <script>

function showPassword(){
    document.getElementById("home").classList.remove("active");
    document.getElementById("passwordPage").classList.add("active");
}

let enteredPassword = "";

function press(num){

    if(enteredPassword.length >= 4) return;

    enteredPassword += num;

    document.getElementById("display").innerHTML =
        "❤️".repeat(enteredPassword.length) +
        "•".repeat(4-enteredPassword.length);

}

function erase(){

    enteredPassword = enteredPassword.slice(0,-1);

    document.getElementById("display").innerHTML =
        "❤️".repeat(enteredPassword.length) +
        "•".repeat(4-enteredPassword.length);

}

function heartBurst(){

for(let i=0;i<30;i++){

let heart=document.createElement("div");

heart.className="heartBurst";

heart.innerHTML="❤️";


heart.style.left="50%";

heart.style.top="50%";


heart.style.setProperty(
"--x",
(Math.random()*400-200)+"px"
);


heart.style.setProperty(
"--y",
(Math.random()*400-200)+"px"
);


document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},1500);


}

}    

function checkPassword(){

  if(enteredPassword==="1711"){

    heartBurst();

    setTimeout(()=>{

        document.getElementById("passwordPage").classList.remove("active");

        document.getElementById("giftPage").classList.add("active");

    },800);


}else{

    alert("Wrong Password Baby 💜");

    enteredPassword="";

    document.getElementById("display").innerHTML="••••";

}

}    
                
    


function openGift(number){
  
event.currentTarget.classList.add("open");


setTimeout(()=>{

const popup=document.getElementById("popup");
const card=document.getElementById("card");

popup.style.display="flex";


if(number==1){

  card.innerHTML=`

<h2>💌 My Letter</h2>

<p style="line-height:30px">

Replace this with your own love letter ❤️

<br><br>

Happy National GF Day Baby😘💜

<br><br>
I just want you to know how thankful I am to have you in my life. Since the day you came into my world, you have brought so much happiness, comfort, and meaning into my life. Thank you for always being there for me, for listening to me, supporting me, and staying by my side through the good and bad moments.

I know I am not perfect, and sometimes I may make mistakes or fail to show my feelings in the best way, but I want you to know that my love and care for you are always real. I will continue learning, improving, and doing my best to make you feel loved and appreciated.

Every memory we create together is something special to me. The small conversations, the laughter, the silly moments, and even the difficult times all become parts of our story that I will always treasure. You are someone who makes my days brighter just by being yourself.

Thank you for choosing me and for giving me the chance to love you. I hope we can continue creating more memories together, supporting each other, and growing stronger no matter what happens in the future.

Always remember that you are special to me, and I will always be grateful for you. I love you more than words can explain ❤️

</p>

<br>

<button onclick="closePopup()">Close</button>

`;

}

if(number==2){

card.innerHTML=`

<h2>❤️ Our Memories</h2>

<p>Swipe our moments baby 💜</p>


<div class="album">

<img src="photos/Photo1.jpg.JPG">
<img src="photos/Photo2.jpg.JPG">
<img src="photos/Photo3.jpg.JPG">
<img src="photos/Photo4.jpg.JPG">
<img src="photos/Photo5.jpg.JPG">
<img src="photos/Photo6.jpg.JPG">
<img src="photos/Photo7.jpg.HEIC">
<img src="photos/Photo8.jpg.HEIC">
<img src="photos/Photo9.jpg.jpg">
<img src="photos/Photo10.jpg.HEIC">

</div>


<button onclick="closePopup()">Close</button>

`;
  
}   

   

 




if(number==3){

card.innerHTML=`

<h2>❤️</h2>

<p>A special video for you baby</p>


<div class="videoBox">

<video controls autoplay>

<source src="videos/love.mp4" type="video/mp4">

</video>

</div>


<button onclick="closePopup()">Close</button>

`;

}
},800);

}  



function closePopup(){

document.getElementById("popup").style.display="none";

}

for(let i=0;i<40;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(Math.random()*6+5)+"s";

heart.style.fontSize=(Math.random()*15+18)+"px";

document.getElementById("hearts").appendChild(heart);

}

</script>

</body>
</html>
